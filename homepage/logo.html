<!DOCTYPE html>
<html><head><meta charset="UTF-8">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@900&display=swap" rel="stylesheet">
<style>
  body{margin:0;background:#333}
  .logo{width:640px;height:640px;background:#0e0b16;border-radius:0;position:relative;
        display:flex;align-items:center;justify-content:center}
  .ring{width:430px;height:430px;border-radius:50%;
        background:conic-gradient(from 120deg,#ff4fa3,#ff8a3d,#ffd23f,#a6f750,#3de8ff,#9b5bff,#ff4fa3);
        display:flex;align-items:center;justify-content:center}
  .disc{width:360px;height:360px;border-radius:50%;background:#0e0b16;
        display:flex;align-items:center;justify-content:center}
  .t{font-family:'Unbounded';font-weight:900;font-size:200px;line-height:1;margin-top:-14px;
     background:linear-gradient(120deg,#ff4fa3,#ff8a3d,#3de8ff);
     -webkit-background-clip:text;background-clip:text;color:transparent}
</style></head>
<body><div class="logo"><div class="ring"><div class="disc"><div class="t">T</div></div></div></div></body></html>
