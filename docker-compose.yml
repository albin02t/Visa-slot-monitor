services:
  app:
    build: .
    init: true                  # reap zombie child processes cleanly
    ports:
      - "${PORT:-8000}:8000"
    volumes:
      - app_data:/data            # per-user Telegram sessions + env files
    environment:
      - DATA_DIR=/data
      # DB connection built from parts in web/db.py (password is URL-encoded,
      # so special characters like @ : / are safe).
      - POSTGRES_HOST=postgres
      - POSTGRES_PORT=5432
      - POSTGRES_USER=visa
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-visa}
      - POSTGRES_DB=visa
      # --- Auth (Google OAuth) ---
      - GOOGLE_CLIENT_ID=${GOOGLE_CLIENT_ID:-}
      - GOOGLE_CLIENT_SECRET=${GOOGLE_CLIENT_SECRET:-}
      - JWT_SECRET=${JWT_SECRET:-change-me-in-production}
      - PUBLIC_BASE_URL=${PUBLIC_BASE_URL:-http://localhost:8000}
      - COOKIE_SECURE=${COOKIE_SECURE:-0}
      - ALLOW_DEV_LOGIN=${ALLOW_DEV_LOGIN:-0}
      # Restrict sign-in to these emails (comma-separated). Empty = open to anyone.
      - ALLOWED_EMAILS=${ALLOWED_EMAILS:-}
      # --- Transactional email (SMTP) ---
      - SMTP_HOST=${SMTP_HOST:-}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USER=${SMTP_USER:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - SMTP_FROM=${SMTP_FROM:-}
      # --- Telegram alert bot (create via @BotFather, one bot for all users) ---
      - TELEGRAM_BOT_TOKEN=${TELEGRAM_BOT_TOKEN:-}
      # --- Cloud LLM for message classification (OpenAI-compatible; Groq default) ---
      - LLM_API_URL=${LLM_API_URL:-https://api.groq.com/openai/v1/chat/completions}
      - LLM_API_KEY=${LLM_API_KEY:-}
      - LLM_MODEL=${LLM_MODEL:-llama-3.1-8b-instant}
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python3", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/healthz')"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_USER=visa
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-visa}
      - POSTGRES_DB=visa
    volumes:
      - pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U visa -d visa"]
      interval: 5s
      timeout: 3s
      retries: 10
    restart: unless-stopped

volumes:
  app_data:
  pg_data:
